<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Ferramentas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>Minha Loja de Ferramentas</h1>
</header>

<main>

    <!-- Seção de seleção de produtos -->
    <div class="produto-selecao">
        <h2>Adicionar Produto</h2>
        <div class="produto-card">
            <select id="produtoSelect">
                {% for produto, preco in itens.items() %}
                <option value="{{ produto }}" data-preco="{{ preco }}">{{ produto }} - R$ {{ preco }}</option>
                {% endfor %}
            </select>
            <input type="number" id="quantidadeInput" placeholder="Quantidade" min="1" value="1">
            <button id="addBtn">Adicionar</button>
        </div>
    </div>

    <!-- Seção do carrinho -->
    <div class="carrinho-secao">
        <h2>Carrinho</h2>
        <table id="carrinhoTable">
            <!-- Tabela preenchida via JS -->
        </table>
        <div id="totalDisplay">Total: R$ 0.00</div>
        <button id="checkoutBtn">Finalizar Compra</button>
    </div>

</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
